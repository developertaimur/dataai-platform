<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DataAI</title>

    <!-- Global and page CSS files -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
</head>

<body>

    <div class="dashboard-layout">

        <!-- Sidebar will load from components/sidebar.html -->
        <div id="sidebar-container"></div>

        <main class="dashboard-main">

            <!-- Topbar will load from components/topbar.html -->
            <div id="topbar-container"></div>

            <!-- Dashboard stats cards -->
            <section class="stats-grid">

                <div class="dashboard-card">
                    <h3>Total Datasets</h3>
                    <p id="totalDatasets">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Credits Remaining</h3>
                    <p id="creditsRemaining">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Queries This Month</h3>
                    <p id="queriesThisMonth">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Storage Used</h3>
                    <p id="storageUsed">0 MB</p>
                </div>

            </section>

            <!-- Recent uploaded datasets -->
            <section class="recent-section">

                <div class="section-top">
                    <h2>Recent Datasets</h2>
                    <a href="datasets.html">View All</a>
                </div>

                <div class="dataset-grid" id="recentDatasetsGrid">
                    <p>Loading recent datasets...</p>
                </div>

            </section>

            <!-- Quick action links -->
            <section class="quick-actions">

                <a href="upload.html" class="action-card">
                    Upload New Dataset
                </a>

                <a href="upload.html" class="action-card">
                    Connect Database
                </a>

                <a href="datasets.html" class="action-card">
                    Ask AI
                </a>

            </section>

        </main>

    </div>

    <!-- Auth guard runs first to protect dashboard page -->
    <script src="../js/authGuard.js"></script>

    <!-- Reusable sidebar/topbar loading -->
    <script src="../js/components.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/topbar.js"></script>

    <!-- Theme and dashboard logic -->
    <script src="../js/theme.js"></script>
    <script src="../js/dashboard.js"></script>

</body>
</html>
